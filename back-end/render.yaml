# Despliegue del backend en Render (plan gratuito)
services:
  - type: web
    name: mora-api
    runtime: node
    plan: free
    rootDir: back-end
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SSL
        value: "true"
      # Define en el panel de Render:
      # DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, CORS_ORIGIN
