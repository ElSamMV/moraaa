# Configuración de Netlify — no hay que tocar nada aquí.
# Netlify lee este archivo solo al conectar el repositorio.

[build]
  base = "front-end"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22.22.3"
  CI = "false"
  # Credenciales públicas de la cuenta de prueba (no son secretas:
  # se muestran en la propia pantalla de login).
  REACT_APP_DEMO_CEDULA = "1000000000"
  REACT_APP_DEMO_PASSWORD = "Demo1234"
  # REACT_APP_API_URL se define en el panel de Netlify (paso 4),
  # porque la URL del backend no se conoce hasta desplegarlo.

# Redirects de SPA: cualquier ruta la resuelve React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
